name: NELVIS Motion Studio — ALUCONGO test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: mkdir -p outputs && npm run render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nelvis-motion-studio-alucongo
          path: outputs/*.mp4
          retention-days: 30
